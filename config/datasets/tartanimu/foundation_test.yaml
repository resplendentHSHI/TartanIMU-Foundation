port: 11570
seeds:
  use_seeds: True
  id: 42

# Test config: run test on verified val data to confirm wandb logging
data:
  dataset: AirLab
  data_path:
      car:   ./verified_data/car/2
      drone: ./verified_data/drone/drone_dataset_uzh_euroc_subt
      dog:   ./verified_data/dog/1+eth
      human: ./verified_data/human/1

  use_local_coord: True
  train_dir: train
  test_dir: val
  validation_dir: val

  random_partition: False
  data_rate: 1.0
  train_rate: 0.75
  valid_rate: 0.25

  imu_freq: 200.0
  sample_freq: 40

  gravity_alignment:
    enabled: False
    magnitude: 9.8101
    direction: [0, 0, -1]
    enable_validation: False
    visualize: False

augment:
  feat_acc_sigma: 0.00005
  feat_gyr_sigma: 0.000005
  add_bias_noise: True
  accel_bias_range: 0.05
  gyro_bias_range: 0.001
  add_gravity_noise: True
  gravity_noise_theta_range: 2

model:
  model_name: Foundation_Model
  model_yaml: 'config/resnet_lstm_multihead.yaml'
  pred_velocity: True
  adapter: False

train:
  out_dir: ./foundation_output/
  use_pretrain_model: True
  use_multi_gpu: False
  use_amp: True
  batch_size: 128
  epochs: 1
  start_cov_epochs: 999
  n_workers: 16
  seq_len: 10
  predict_start: 0
  predict_end: 10
  add_noise: False
  active_heads: ["car", "dog", "drone", "human"]

  optimizer:
    learning_rate: 0.0002
    method: Adam
    weight_decay: 0.005

  scheduler:
    factor: 0.5
    patience: 3

val:
  batch_size: 256
  n_workers: 4

test:
  out_dir: ./foundation_output/test_results/
  batch_size: 16
  n_workers: 2

schemes:
  train: False
  test: True
  online_adaption: False
